<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Workia</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #fafafa;
        color: #171717;
        padding: 16px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #ededed;
        }
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
      }
      p {
        line-height: 1.5;
        opacity: 0.8;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: #1f2937;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/brand/workia-logo.svg"
        alt="Workia"
        width="240"
        height="41"
        style="display: block; margin: 0 auto 24px"
      />
      <h1>No hay conexión</h1>
      <p>
        Para fichar y consultar tus datos necesitas conexión a internet. Ningún dato se guarda en
        este dispositivo sin conexión.
      </p>
      <a href="/panel">Reintentar</a>
    </main>
  </body>
</html>
