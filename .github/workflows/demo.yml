# Demostración navegable en GitHub Pages (ADR-070): vangreeneurope.github.io/workia.
# Construye la app en modo demo, la recorre contra el entorno E2E con datos
# SINTÉTICOS (nunca contra Supabase real) y publica el sitio estático. Sin
# secretos. Requiere activar Pages con «GitHub Actions» como origen
# (Settings › Pages).
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Una publicación a la vez; no se cancela una en curso.
  group: demo-pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  generar:
    name: Generar la demostración
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # versión vAA.N: commits del año (scripts/version.mjs)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Caché de PostgREST (versión y huella fijas en scripts/e2e/stack.sh)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/portal-e2e
          key: postgrest-12.2.3
      - run: npx playwright install --with-deps chromium
      - name: PostgreSQL local para el entorno E2E (binarios, sin servicio)
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Construir y recorrer la demostración
        run: bash scripts/demo/build.sh
        env:
          APP_COMMIT: ${{ github.sha }}
          DEMO_OUT: demo-out
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: demo-out

  publicar:
    name: Publicar en GitHub Pages
    needs: generar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
