name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, formato y unitarias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  seguridad:
    name: Secretos y dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Sin secretos versionados (claves, tokens, .env, cadenas de conexión).
      - run: npm run security:secrets
      # Producción sin vulnerabilidades altas o críticas. Las de herramientas de
      # desarrollo se revisan en docs/SEGURIDAD.md (riesgo aceptado y fecha).
      - run: npm run security:audit
      - name: Informe completo (no bloquea)
        run: npm audit || true

  base-de-datos:
    name: Migraciones, aislamiento RLS, reversibilidad y tipos
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base desechable del propio job: credenciales de prueba, no secretos.
      TEST_DB_EXTERNAL: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pruebas positivas y negativas de aislamiento multiempresa
        run: npm run test:db
      - name: Los tipos TypeScript coinciden con las migraciones
        run: npm run db:types:check

  build-e2e:
    name: Build y E2E
    runs-on: ubuntu-24.04
    needs: calidad
    env:
      # Las E2E con sesión usan el entorno de pruebas local (scripts/e2e/stack.sh):
      # PostgreSQL desechable, PostgREST y la pasarela de pruebas en 127.0.0.1:54321.
      # Ningún secreto real: la clave publicable es de relleno.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_solo_para_build
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: PostgreSQL local para el entorno E2E (binarios, sin servicio)
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Caché de PostgREST (versión y huella fijas en scripts/e2e/stack.sh)
        uses: actions/cache@v4
        with:
          path: ~/.cache/portal-e2e
          key: postgrest-12.2.3
      - run: npm run build
      - run: npm run test:e2e
      - name: Informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
